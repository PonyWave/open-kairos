# k1 单节点配置；运行时与 cgroup 入口由 isolated-k3s.sh 固定。
data-dir: /var/lib/kairos-sandbox/k3s
default-local-storage-path: /var/lib/kairos-sandbox/volumes
node-name: kairos-k1
node-ip: 172.27.134.23
flannel-iface: eth0
flannel-backend: host-gw
protect-kernel-defaults: true
cluster-cidr: 10.250.0.0/16
service-cidr: 10.251.0.0/16
cluster-dns: 10.251.0.10
write-kubeconfig-mode: "0600"
secrets-encryption: true
disable:
  - traefik
  - servicelb
  - metrics-server
kubelet-arg:
  - pod-max-pids=256
  - max-pods=64
  - system-reserved=cpu=500m,memory=512Mi
  - kube-reserved=cpu=500m,memory=512Mi
