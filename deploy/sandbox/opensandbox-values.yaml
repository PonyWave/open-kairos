base:
  enabled: true
fast-sandbox:
  enabled: false
opensandbox-node-agent:
  enabled: false
opensandbox-controller:
  controller:
    image:
      tag: release-1.2.0@sha256:7701db7eacda4c3533a961e0451f6ce067535d8ce46f15765a04dcf0ffa6e2c6
    replicaCount: 1
    snapshot:
      imageCommitterImage: sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/image-committer:release-1.2.0@sha256:5320733579d1cb56322b345927b2c48a8b73f4a6ab32e22d203cc0bcf33ff0f9
      containerdSocketPath: /run/k3s/containerd/containerd.sock
      registry: 10.251.0.50:5000/kairos
      registryInsecure: false
      snapshotPushSecret: snapshot-push
      resumePullSecret: snapshot-pull
      commitJobTimeout: 10m
      imageCommitterPodTemplate:
        spec:
          automountServiceAccountToken: false
          containers:
            - name: commit
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: "1", memory: 1Gi }
              env:
                - name: CONTAINERD_NAMESPACE
                  value: k8s.io
                - name: SSL_CERT_DIR
                  value: /etc/ssl/certs:/etc/kairos-registry
              volumeMounts:
                - name: snapshot-registry-ca
                  mountPath: /etc/kairos-registry
                  readOnly: true
          volumes:
            - name: snapshot-registry-ca
              configMap:
                name: snapshot-registry-ca
ingress-gateway:
  enabled: true
  gateway:
    image:
      tag: release-1.2.0@sha256:c7fc7faa8e48793c6c9e74bb1178b46121abdaba315b51704163a8faa1f7cc83
    replicaCount: 1
    dataplaneNamespace: opensandbox
    providerType: batchsandbox
    gatewayRouteMode: header
    activity: { enabled: false }
    wake: { enabled: false }
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
    secureAccess:
      existingSecret: sandbox-route-keys
opensandbox-server:
  server:
    image:
      tag: release-1.2.0@sha256:25bebdcf1cf7724eb923faecbdbbf82d4038c6ab35c736151574726d14006f30
    replicaCount: 1
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
    env:
      - name: OPENSANDBOX_SERVER_API_KEY
        valueFrom:
          secretKeyRef: { name: opensandbox-api-key, key: api-key }
    gateway:
      enabled: true
      host: opensandbox-ingress-gateway.opensandbox-system.svc.cluster.local
      gatewayRouteMode: header
      secureAccess:
        existingSecret: sandbox-route-keys
    volumes:
      - name: state
        persistentVolumeClaim: { claimName: opensandbox-metadata }
      - name: sandbox-template
        configMap: { name: kairos-sandbox-template }
    volumeMounts:
      - { name: state, mountPath: /var/lib/opensandbox }
      - { name: sandbox-template, mountPath: /etc/kairos-template, readOnly: true }
  configToml: |
    [server]
    host = "0.0.0.0"
    port = 80
    [runtime]
    type = "kubernetes"
    execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:release-1.2.0@sha256:c75836c46ef4302afccec182d5d7339eb2f905f51e3d73b7aa17bb76c832526c"
    [kubernetes]
    namespace = "opensandbox"
    workload_provider = "batchsandbox"
    batchsandbox_template_file = "/etc/kairos-template/sandbox-template.yaml"
    [store]
    type = "sqlite"
    path = "/var/lib/opensandbox/opensandbox.db"
    [automation.idle_pause]
    enabled = false
