# Apply together with opensandbox-values.yaml only when M1 is explicitly deployed.
opensandbox-controller:
  controller:
    snapshot:
      commitJobTimeout: 10m
      imageCommitterPodTemplate:
        metadata:
          labels:
            kairos.io/network-role: snapshot
          annotations:
            kairos.io/physical-observed: ""
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: snapshot-pull
          initContainers:
            - name: physical-observation
              image: 10.251.0.50:5000/base/ubuntu:24.04-amd64@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - >-
                  count=0; while [ "$count" -lt 480 ]; do
                  observed=$(cat /run/kairos-observation/observed);
                  actual=$(cat /run/kairos-observation/uid);
                  if [ -n "$actual" ] && [ "$observed" = "$actual" ]; then exit 0; fi;
                  count=$((count+1)); sleep 1; done; exit 1
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 32Mi }
              volumeMounts:
                - name: physical-observation
                  mountPath: /run/kairos-observation
                  readOnly: true
          volumes:
            - name: snapshot-registry-ca
              configMap:
                name: snapshot-registry-ca
            - name: physical-observation
              downwardAPI:
                defaultMode: 0444
                items:
                  - path: uid
                    fieldRef: { fieldPath: metadata.uid }
                  - path: observed
                    fieldRef: { fieldPath: "metadata.annotations['kairos.io/physical-observed']" }
