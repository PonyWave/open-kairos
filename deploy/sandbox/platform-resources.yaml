apiVersion: v1
kind: PersistentVolume
metadata:
  name: kairos-platform-program
spec:
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kairos-platform-program
  hostPath:
    path: /var/lib/kairos-sandbox/volumes/program
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [kairos-k1]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kairos-platform-program
  namespace: opensandbox
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: kairos-platform-program
  volumeName: kairos-platform-program
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kairos-platform-manager
  namespace: opensandbox
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kairos-platform-manager
  namespace: opensandbox
rules:
  - apiGroups: [sandbox.opensandbox.io]
    resources: [batchsandboxes, sandboxsnapshots]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kairos-platform-manager
  namespace: opensandbox
subjects:
  - kind: ServiceAccount
    name: kairos-platform-manager
    namespace: opensandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kairos-platform-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kairos-platform-node-identity
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [kairos-k1]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kairos-platform-node-identity
subjects:
  - kind: ServiceAccount
    name: kairos-platform-manager
    namespace: opensandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kairos-platform-node-identity
