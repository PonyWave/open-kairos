metadata:
  labels:
    kairos.io/purpose: p3-m0
spec:
  replicas: 1
  template:
    metadata:
      labels:
        kairos.io/purpose: p3-m0
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: snapshot-pull
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
