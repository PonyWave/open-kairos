syntax = "proto3";

package kairos.gui.v1;

enum AuthenticationState {
  AUTHENTICATION_STATE_UNSPECIFIED = 0;
  AUTHENTICATION_STATE_ANONYMOUS = 1;
  AUTHENTICATION_STATE_PROFILE_REQUIRED = 2;
  AUTHENTICATION_STATE_AUTHENTICATED = 3;
}

message Identity {
  string user_id = 1;
  string email = 2;
  string username = 3;
  string tenant_id = 4;
  string main_thread_id = 5;
  reserved 6;
  reserved "default_env_id";
  optional string avatar_id = 7;
  uint32 profile_version = 8;
}

message BootstrapSessionRequest {
  string token = 1;
}

message BootstrapSessionResponse {
  Identity identity = 1;
}

message GetCurrentIdentityRequest {}

message GetCurrentIdentityResponse {
  AuthenticationState state = 1;
  optional Identity identity = 2;
}

message LogoutRequest {}

message LogoutResponse {}

service AuthService {
  rpc BootstrapSession(BootstrapSessionRequest) returns (BootstrapSessionResponse);
  rpc GetCurrentIdentity(GetCurrentIdentityRequest) returns (GetCurrentIdentityResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}
